name: check

on:
  pull_request:
  push:
    branches: [unguarded]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Validate manifests
        run: |
          for file in manifests/*.json; do
            jq -e '.upstream.commit | test("^[0-9a-f]{40}$")' "$file" > /dev/null
            jq -e '.upstream.version' "$file" > /dev/null
            jq -e '.removals | length > 0' "$file" > /dev/null
          done

      - name: Install derivative tooling dependencies
        run: bun install

      - name: Run derivative tests
        run: bun test ./test/unguarded/

      - name: Verify checked-in source is fully patched
        run: |
          VERSION=$(jq -r .upstream.version manifests/*.json | head -1)
          bun script/unguarded/apply.ts "$VERSION" --root . --check
          bun script/unguarded/telemetry.ts . --check
          bun script/unguarded/lifecycle.ts . --check

      - name: Verify each manifest against its pinned upstream source
        run: |
          for file in manifests/*.json; do
            VERSION=$(jq -r .upstream.version "$file")
            COMMIT=$(jq -r .upstream.commit "$file")
            DIR=$(mktemp -d)
            git -C "$DIR" init -q
            git -C "$DIR" remote add origin https://github.com/anomalyco/opencode.git
            git -C "$DIR" fetch -q --depth=1 origin "$COMMIT"
            git -C "$DIR" checkout -q FETCH_HEAD
            # A pinned checkout is pristine: apply, then verify the resulting state.
            bun script/unguarded/apply.ts "$VERSION" --root "$DIR" || exit 1
            bun script/unguarded/apply.ts "$VERSION" --root "$DIR" --check || exit 1
            rm -rf "$DIR"
          done

      - name: Verify workflows parse
        run: |
          for file in .github/workflows/*.yml; do
            bun -e "const yaml=require('yaml'); const fs=require('fs'); yaml.parse(fs.readFileSync('$file','utf8'))" 2>/dev/null || \
              python3 -c "import yaml,sys; yaml.safe_load(open('$file'))"
          done
