name: check

on:
  pull_request:
  push:
    branches: [unguarded]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # Ancestry verification needs the pinned upstream commit in history.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Validate manifests
        run: |
          for file in manifests/*.json; do
            jq -e '.schema == 2' "$file" > /dev/null
            jq -e '.upstream.commit | test("^[0-9a-f]{40}$")' "$file" > /dev/null
            jq -e '.upstream.version' "$file" > /dev/null
            jq -e '.files | length > 0' "$file" > /dev/null
            jq -e '.protected | length > 0' "$file" > /dev/null
            jq -e '[.files[] | .final, (.pristine // "added")] | all(test("^([0-9a-f]{64}|added)$"))' "$file" > /dev/null
          done

      - name: Install derivative tooling dependencies
        run: bun install

      - name: Verify the checked-in derivative tree
        run: |
          for file in manifests/*.json; do
            VERSION=$(jq -r .upstream.version "$file")
            bun script/unguarded/apply.ts "$VERSION" --root . --check
            bun script/unguarded/lifecycle.ts --root . --check
            bun script/unguarded/telemetry.ts . --check
          done

      - name: Canonical repository check
        run: bun run check

      - name: Run derivative tests
        env:
          UNGUARDED_DERIVATIVE_ROOT: ${{ github.workspace }}
          UNGUARDED_UPSTREAM: ${{ github.workspace }}/.check/upstream
        run: |
          mkdir -p .check
          VERSION=$(jq -r .upstream.version "$(ls manifests/*.json | head -1)")
          COMMIT=$(jq -r .upstream.commit "$(ls manifests/*.json | head -1)")
          REPOSITORY=$(jq -r .upstream.repository "$(ls manifests/*.json | head -1)")
          DIR=.check/upstream
          rm -rf "$DIR"
          git init -q "$DIR"
          git -C "$DIR" remote add origin "$REPOSITORY"
          git -C "$DIR" fetch -q --depth=1 origin "$COMMIT"
          git -C "$DIR" checkout -q FETCH_HEAD
          bun test ./test/unguarded/

      - name: Verify each manifest against its pinned upstream source
        env:
          UNGUARDED_UPSTREAM: ${{ github.workspace }}/.check/upstream
        run: |
          mkdir -p .check
          for file in manifests/*.json; do
            VERSION=$(jq -r .upstream.version "$file")
            COMMIT=$(jq -r .upstream.commit "$file")
            DIR=.check/upstream
            rm -rf "$DIR"
            git init -q "$DIR"
            git -C "$DIR" remote add origin "$(jq -r .upstream.repository "$file")"
            git -C "$DIR" fetch -q --depth=1 origin "$COMMIT"
            git -C "$DIR" checkout -q FETCH_HEAD
            (cd test && UNGUARDED_DERIVATIVE_ROOT="$GITHUB_WORKSPACE" UNGUARDED_UPSTREAM="$DIR" bun test unguarded/apply.test.ts)
            bun script/unguarded/apply.ts "$VERSION" --root "$DIR"
            bun script/unguarded/apply.ts "$VERSION" --root "$DIR" --check
            bun script/unguarded/lifecycle.ts --root "$DIR" --check
            bun script/unguarded/telemetry.ts "$DIR" --check
            git -C "$DIR" add -A -N
            CHANGED=$(git -C "$DIR" diff --name-only | sort)
            ALLOWED=$(jq -r '.files[].file' "$file" | sort)
            if [ "$CHANGED" != "$ALLOWED" ]; then
              echo "Patched files do not match the manifest for $VERSION" >&2
              diff <(printf '%s\n' "$ALLOWED") <(printf '%s\n' "$CHANGED") >&2 || true
              exit 1
            fi
            for protected in $(jq -r '.protected[].file' "$file"); do
              test -z "$(git -C "$DIR" diff --name-only -- "$protected")" || {
                echo "Protected file changed: $protected" >&2
                exit 1
              }
            done
          done

      - name: Verify packaging scripts parse
        run: |
          for file in packaging/linux-x64/*.sh packaging/linux-x64/launcher; do bash -n "$file"; done

      - name: Verify workflows parse
        run: |
          for file in .github/workflows/*.yml; do
            bun -e "const yaml=require('yaml'); const fs=require('fs'); yaml.parse(fs.readFileSync('$file','utf8'))" 2>/dev/null || \
              python3 -c "import yaml,sys; yaml.safe_load(open('$file'))"
          done
