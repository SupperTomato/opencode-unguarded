name: build-release
run-name: build ${{ inputs.upstream_version }}-unguarded.${{ inputs.derivative_revision }}

on:
  workflow_dispatch:
    inputs:
      upstream_version:
        description: "Upstream version to build (must have a manifest in manifests/)"
        required: true
        type: string
      publish:
        description: "Publish a GitHub release after verification"
        required: false
        default: false
        type: boolean
      derivative_revision:
        description: "Derivative revision for this upstream version (e.g. 3)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: build-release-${{ inputs.upstream_version }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Validate input
        env:
          VERSION: ${{ inputs.upstream_version }}
          REVISION: ${{ inputs.derivative_revision }}
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid upstream_version: $VERSION" >&2
            exit 1
          fi
          if ! printf '%s' "$REVISION" | grep -Eq '^[1-9][0-9]*$'; then
            echo "Invalid derivative_revision: $REVISION" >&2
            exit 1
          fi

      - name: Checkout derivative
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record build identity
        id: identity
        run: |
          echo "derivative_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "manifest_sha=$(sha256sum "manifests/${{ inputs.upstream_version }}.json" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Verify manifest exists
        env:
          VERSION: ${{ inputs.upstream_version }}
        run: test -f "manifests/${VERSION}.json" || { echo "No manifest for ${VERSION}" >&2; exit 1; }

      - name: Read pinned commit
        id: pin
        env:
          VERSION: ${{ inputs.upstream_version }}
        run: |
          COMMIT=$(jq -r .upstream.commit "manifests/${VERSION}.json")
          printf '%s' "$COMMIT" | grep -Eq '^[0-9a-f]{40}$' || { echo "Bad commit in manifest" >&2; exit 1; }
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"

      - name: Checkout upstream source
        uses: actions/checkout@v4
        with:
          repository: anomalyco/opencode
          ref: ${{ steps.pin.outputs.commit }}
          path: opencode-src

      - name: Checkout pristine upstream source
        uses: actions/checkout@v4
        with:
          repository: anomalyco/opencode
          ref: ${{ steps.pin.outputs.commit }}
          path: .check/pristine

      - name: Verify upstream identity
        env:
          COMMIT: ${{ steps.pin.outputs.commit }}
        run: |
          ACTUAL=$(git -C opencode-src rev-parse HEAD)
          if [ "$ACTUAL" != "$COMMIT" ]; then
            echo "Upstream commit mismatch: $ACTUAL != $COMMIT" >&2
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: opencode-src/package.json

      - name: Install dependencies
        working-directory: opencode-src
        run: bun install --frozen-lockfile

      - name: Apply reviewed patches
        env:
          VERSION: ${{ inputs.upstream_version }}
        run: |
          bun script/unguarded/apply.ts "$VERSION" --root opencode-src
          # The binary gates run after the build; here only source gates must pass.
          bun script/unguarded/validate.ts --version "$VERSION" --root opencode-src --upstream .check/pristine

      - name: Verify no unintended source drift
        run: |
          git -C opencode-src diff --check
          # Derivative-added files are untracked; stage the intent so the change
          # set includes them without committing anything.
          git -C opencode-src add -A -N
          CHANGED=$(git -C opencode-src diff --name-only | sort)
          ALLOWED=$(jq -r '.files[].file' "manifests/${{ inputs.upstream_version }}.json" | sort)
          if [ "$CHANGED" != "$ALLOWED" ]; then
            echo "Changed files do not match the manifest exactly" >&2
            diff <(printf '%s\n' "$ALLOWED") <(printf '%s\n' "$CHANGED") >&2 || true
            exit 1
          fi
          PROTECTED=$(jq -r '.protected[].file' "manifests/${{ inputs.upstream_version }}.json")
          for file in $PROTECTED; do
            if ! git -C opencode-src diff --quiet -- "$file"; then
              echo "Protected file changed: $file" >&2
              exit 1
            fi
          done

      - name: Canonical repository check
        working-directory: opencode-src
        # The release source is the tree that becomes the binary, so it gets the
        # same canonical lint and typecheck the repository requires. Re-running
        # the frozen install first repairs a partially linked dependency tree
        # (for example a workspace whose hoisted tsconfig did not link), which
        # would otherwise fail an unrelated package.
        run: |
          bun install --frozen-lockfile
          bun run check

      - name: Run derivative tooling tests
        env:
          UNGUARDED_SOURCE_ROOT: ${{ github.workspace }}/opencode-src
          UNGUARDED_DERIVATIVE_ROOT: ${{ github.workspace }}
          UNGUARDED_UPSTREAM: ${{ github.workspace }}/.check/pristine
        working-directory: ${{ github.workspace }}/test
        run: bun test unguarded/

      - name: Stage derivative suites into the release source
        env:
          DERIVATIVE_ROOT: ${{ github.workspace }}
        run: |
          # These behavioral suites and fixtures are derivative-only files. The
          # manifest applies to upstream source, so copy them explicitly and
          # prove they exist before asking bun to run them.
          mkdir -p opencode-src/packages/cli/test/fixture opencode-src/packages/client/test opencode-src/packages/util/test
          for file in \
            packages/cli/test/unguarded-updater.test.ts \
            packages/cli/test/unguarded-service.test.ts \
            packages/cli/test/unguarded-database.test.ts \
            packages/cli/test/fixture/unguarded-updater.ts \
            packages/cli/test/fixture/unguarded-service.ts \
            packages/client/test/unguarded-ownership.test.ts \
            packages/client/test/unguarded-termination.test.ts \
            packages/util/test/unguarded-roots.test.ts; do
            cp "$DERIVATIVE_ROOT/$file" "opencode-src/$file"
            test -s "opencode-src/$file" || { echo "missing derivative test file: $file" >&2; exit 1; }
          done

      - name: Run affected upstream suites
        working-directory: opencode-src/packages/cli
        run: bun test --timeout 30000 test/upgrade.test.ts test/unguarded-updater.test.ts test/unguarded-service.test.ts test/unguarded-database.test.ts test/debug-paths.test.ts test/service-lifecycle.test.ts

      - name: Run affected client suites
        working-directory: opencode-src/packages/client
        # Both production clients and the upstream lifecycle suites they changed.
        run: bun test --timeout 30000 test/service.test.ts test/promise-service.test.ts test/service-reconnect.test.ts test/service-decision.test.ts test/unguarded-ownership.test.ts test/unguarded-termination.test.ts

      - name: Run affected util derivatives
        working-directory: opencode-src/packages/util
        run: bun test test/unguarded-roots.test.ts test/observability-otlp.test.ts

      - name: Run affected core suites
        working-directory: opencode-src/packages/core
        run: bun run script/test.ts test/plugin/optimize.test.ts test/plugin/unguarded-routing.test.ts test/plugin/plan.test.ts test/plugin/permission-assert.test.ts


      - name: Build linux-x64
        working-directory: opencode-src/packages/cli
        env:
          OPENCODE_VERSION: ${{ inputs.upstream_version }}
          OPENCODE_CHANNEL: unguarded
          OPENCODE_UNGUARDED: "1"
          OPENCODE_UNGUARDED_REVISION: ${{ inputs.derivative_revision }}
          OPENCODE_UNGUARDED_UPSTREAM: ${{ steps.pin.outputs.commit }}
        run: bun run script/build.ts --target=opencode-linux-x64 --skip-install

      - name: Verify artifact
        env:
          VERSION: ${{ inputs.upstream_version }}
          REVISION: ${{ inputs.derivative_revision }}
        run: |
          BIN=opencode-src/packages/cli/dist/cli-linux-x64/bin/opencode
          test -x "$BIN"
          REPORTED=$("$BIN" --version)
          echo "reported: $REPORTED"
          case "$REPORTED" in
            *"v$VERSION-unguarded.$REVISION"*) ;;
            *) echo "Version mismatch: $REPORTED" >&2; exit 1 ;;
          esac
          "$BIN" --help > /dev/null
          bun script/unguarded/validate.ts --version "$VERSION" --root opencode-src --upstream .check/pristine --binary "$BIN" --release

      - name: Verify telemetry egress with a positive control
        env:
          VERSION: ${{ inputs.upstream_version }}
        run: |
          # Build a stock binary from the same pinned source and lockfile so the
          # positive control differs only by the derivative patches.
          git clone --quiet https://github.com/anomalyco/opencode opencode-stock
          git -C opencode-stock checkout --quiet "${{ steps.pin.outputs.commit }}"
          (cd opencode-stock && bun install --frozen-lockfile)
          (cd opencode-stock/packages/cli && \
            OPENCODE_VERSION="$VERSION" OPENCODE_CHANNEL=latest \
            bun run script/build.ts --target=opencode-linux-x64 --skip-install)
          bash packaging/linux-x64/telemetry-harness.sh \
            opencode-src/packages/cli/dist/cli-linux-x64/bin/opencode \
            opencode-stock/packages/cli/dist/cli-linux-x64/bin/opencode

      - name: Package
        env:
          VERSION: ${{ inputs.upstream_version }}
          REVISION: ${{ inputs.derivative_revision }}
        run: |
          STAGE=package/opencode-unguarded
          mkdir -p "$STAGE/bin" "$STAGE/libexec"
          cp opencode-src/packages/cli/dist/cli-linux-x64/bin/opencode "$STAGE/libexec/opencode"
          cp packaging/linux-x64/launcher "$STAGE/bin/opencode-unguarded"
          cp packaging/linux-x64/install.sh "$STAGE/install.sh"
          cp packaging/linux-x64/uninstall.sh "$STAGE/uninstall.sh"
          cp packaging/linux-x64/telemetry-harness.sh "$STAGE/telemetry-harness.sh"
          cp packaging/linux-x64/model-stub.ts "$STAGE/model-stub.ts"
          cp packaging/linux-x64/acceptance.sh "$STAGE/acceptance.sh"
          cp script/unguarded/collector.ts "$STAGE/collector.ts"
          chmod +x "$STAGE/libexec/opencode" "$STAGE/bin/opencode-unguarded" \
            "$STAGE/install.sh" "$STAGE/uninstall.sh" "$STAGE/telemetry-harness.sh" "$STAGE/acceptance.sh"
          cp LICENSE "$STAGE/LICENSE"
          cp THIRD_PARTY_NOTICES.md "$STAGE/THIRD_PARTY_NOTICES.md"
          jq -n \
            --arg v "$VERSION" \
            --arg c "$(jq -r .upstream.commit "manifests/$VERSION.json")" \
            --arg pkg "$(jq -r .upstream.npmPackage "manifests/$VERSION.json")" \
            --arg dc "${{ steps.identity.outputs.derivative_commit }}" \
            --arg mh "${{ steps.identity.outputs.manifest_sha }}" \
            --arg rev "$REVISION" \
            --arg run "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --arg bun "$(bun --version)" \
            --arg node "$(node --version)" \
            --arg lock "$(sha256sum opencode-src/bun.lock | cut -d' ' -f1)" \
            --arg bin "$(sha256sum "$STAGE/libexec/opencode" | cut -d' ' -f1)" \
            --arg launcher "$(sha256sum "$STAGE/bin/opencode-unguarded" | cut -d' ' -f1)" \
            '{version:$v, upstreamPackage:$pkg, upstreamCommit:$c, derivative:"opencode-unguarded",
              derivativeCommit:$dc, derivativeRevision:$rev, manifestSha256:$mh, workflowRun:$run,
              bunVersion:$bun, nodeVersion:$node, upstreamLockSha256:$lock,
              executableSha256:$bin, launcherSha256:$launcher,
              target:"linux-x64", channel:"unguarded"}' \
            > "$STAGE/BUILD-INFO.json"
          cat "$STAGE/BUILD-INFO.json"
          tar -C package -czf "opencode-unguarded-linux-x64.tar.gz" opencode-unguarded
          sha256sum opencode-unguarded-linux-x64.tar.gz > checksums.sha256

          # A published package must be installable and removable on its own:
          # the packaged installer, launcher, and uninstaller are exercised from
          # the extracted archive before it is uploaded.
          ACCEPT="$RUNNER_TEMP/acceptance"
          rm -rf "$ACCEPT"
          mkdir -p "$ACCEPT"
          tar xzf opencode-unguarded-linux-x64.tar.gz -C "$ACCEPT"
          # No files are copied into the extracted tree: acceptance must pass on
          # exactly the packaged bytes.
          bash "$ACCEPT/opencode-unguarded/acceptance.sh" "$ACCEPT/opencode-unguarded" "$PWD/opencode-unguarded-linux-x64.tar.gz"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencode-unguarded-linux-x64
          path: |
            opencode-unguarded-linux-x64.tar.gz
            checksums.sha256
          retention-days: 30

  publish:
    needs: build
    if: inputs.publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout derivative
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download verified artifact
        uses: actions/download-artifact@v4
        with:
          name: opencode-unguarded-linux-x64

      - name: Verify downloaded artifact
        env:
          VERSION: ${{ inputs.upstream_version }}
          REVISION: ${{ inputs.derivative_revision }}
        run: |
          sha256sum -c checksums.sha256
          tar tzf opencode-unguarded-linux-x64.tar.gz > /dev/null
          tar xzf opencode-unguarded-linux-x64.tar.gz
          ./opencode-unguarded/bin/opencode-unguarded --version
          ./opencode-unguarded/bin/opencode-unguarded --help > /dev/null
          jq -e --arg v "$VERSION" --arg r "$REVISION" \
            '.version == $v and .derivativeRevision == $r and .derivative == "opencode-unguarded"' \
            opencode-unguarded/BUILD-INFO.json > /dev/null
          # The packaged binary must match the identity recorded at build time.
          test "$(sha256sum opencode-unguarded/libexec/opencode | cut -d' ' -f1)" = \
            "$(jq -r .executableSha256 opencode-unguarded/BUILD-INFO.json)"
          test "$(sha256sum opencode-unguarded/bin/opencode-unguarded | cut -d' ' -f1)" = \
            "$(jq -r .launcherSha256 opencode-unguarded/BUILD-INFO.json)"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.upstream_version }}
          REVISION: ${{ inputs.derivative_revision }}
        run: |
          TAG="v${VERSION}-unguarded.${REVISION}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite" >&2
            exit 1
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "${{ github.sha }}" \
            --title "OpenCode Unguarded v${VERSION} (revision ${REVISION})" \
            --notes-file RELEASE_NOTES.md \
            opencode-unguarded-linux-x64.tar.gz checksums.sha256
