name: build-release

on:
  workflow_dispatch:
    inputs:
      upstream_version:
        description: "Upstream version to build (must have a manifest in manifests/)"
        required: true
        type: string
      publish:
        description: "Publish a GitHub release after verification"
        required: false
        default: false
        type: boolean
      derivative_revision:
        description: "Derivative revision for this upstream version (e.g. 2)"
        required: true
        default: "2"
        type: string

permissions:
  contents: read

concurrency:
  group: build-release-${{ inputs.upstream_version }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Validate input
        env:
          VERSION: ${{ inputs.upstream_version }}
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid upstream_version: $VERSION" >&2
            exit 1
          fi

      - name: Checkout derivative
        uses: actions/checkout@v4

      - name: Record build identity
        id: identity
        run: |
          echo "derivative_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "manifest_sha=$(sha256sum "manifests/${{ inputs.upstream_version }}.json" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Verify manifest exists
        env:
          VERSION: ${{ inputs.upstream_version }}
        run: test -f "manifests/${VERSION}.json" || { echo "No manifest for ${VERSION}" >&2; exit 1; }

      - name: Read pinned commit
        id: pin
        env:
          VERSION: ${{ inputs.upstream_version }}
        run: |
          COMMIT=$(jq -r .upstream.commit "manifests/${VERSION}.json")
          TAG=$(jq -r .upstream.tag "manifests/${VERSION}.json")
          printf '%s' "$COMMIT" | grep -Eq '^[0-9a-f]{40}$' || { echo "Bad commit in manifest" >&2; exit 1; }
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout upstream source
        uses: actions/checkout@v4
        with:
          repository: anomalyco/opencode
          ref: ${{ steps.pin.outputs.commit }}
          path: opencode-src

      - name: Verify upstream identity
        env:
          COMMIT: ${{ steps.pin.outputs.commit }}
        run: |
          ACTUAL=$(git -C opencode-src rev-parse HEAD)
          if [ "$ACTUAL" != "$COMMIT" ]; then
            echo "Upstream commit mismatch: $ACTUAL != $COMMIT" >&2
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: opencode-src/package.json

      - name: Install dependencies
        working-directory: opencode-src
        run: bun install --frozen-lockfile

      - name: Apply guardrail manifest
        env:
          VERSION: ${{ inputs.upstream_version }}
        run: bun script/unguarded/apply.ts "$VERSION" --root opencode-src

      - name: Apply telemetry removal
        run: bun script/unguarded/telemetry.ts opencode-src

      - name: Apply derivative lifecycle patches
        run: bun script/unguarded/lifecycle.ts opencode-src

      - name: Verify no unintended source drift
        run: |
          git -C opencode-src diff --check
          CHANGED=$(git -C opencode-src diff --name-only)
          echo "$CHANGED"
          if printf '%s' "$CHANGED" | grep -Ev '^(packages/(core/src/plugin/system-prompt|core/src/session/runner/prompt/system\.txt|util/src|app/src/entry\.tsx|app/vite\.config\.ts|desktop/electron\.vite\.config\.ts|desktop/src/renderer/startup/sentry\.ts|cli/src/commands/handlers/upgrade\.ts|cli/src/services/service-config\.ts|cli/src/database-path\.ts)|packages/util/test/observability-otlp\.test\.ts)'; then
            echo "Unexpected files changed by patches" >&2
            exit 1
          fi

      - name: Typecheck patched packages
        working-directory: opencode-src
        run: |
          bun run --cwd packages/util typecheck
          bun run --cwd packages/core typecheck
          bun run --cwd packages/app typecheck

      - name: Verify patched source (exact release source)
        env:
          VERSION: ${{ inputs.upstream_version }}
        run: |
          bun script/unguarded/apply.ts "$VERSION" --root opencode-src --check
          bun script/unguarded/telemetry.ts opencode-src --check
          bun script/unguarded/lifecycle.ts opencode-src --check

      - name: Run derivative tests against the release source
        env:
          UNGUARDED_SOURCE_ROOT: ${{ github.workspace }}/opencode-src
          UNGUARDED_PRISTINE: ${{ github.workspace }}/opencode-src
        run: bun test ./test/unguarded/

      - name: Verify preserved runtime permissions are unchanged
        run: |
          git -C opencode-src diff --exit-code -- \
            packages/core/src/permission.ts \
            packages/core/src/plugin/agent.ts \
            packages/core/src/plugin/plan.ts

      - name: Build linux-x64
        working-directory: opencode-src/packages/cli
        env:
          OPENCODE_VERSION: ${{ inputs.upstream_version }}
          OPENCODE_CHANNEL: unguarded
        run: bun run script/build.ts --target=opencode-linux-x64 --skip-install

      - name: Verify artifact
        env:
          VERSION: ${{ inputs.upstream_version }}
        run: |
          BIN=opencode-src/packages/cli/dist/cli-linux-x64/bin/opencode
          test -x "$BIN"
          REPORTED=$("$BIN" --version | awk '{print $2}')
          if [ "$REPORTED" != "v$VERSION" ]; then
            echo "Version mismatch: $REPORTED" >&2
            exit 1
          fi
          "$BIN" --help > /dev/null
          for BANNED in "If you cannot or will not help" "Always follow security best practices" "you should never access" "ask for confirmation each time" "without a violation" "OTLPTraceExporter" "VITE_SENTRY_DSN" "sentryVitePlugin"; do
            if strings -n 8 "$BIN" | grep -qF "$BANNED"; then
              echo "Banned string remains: $BANNED" >&2
              exit 1
            fi
          done
          if ! strings -n 8 "$BIN" | grep -qF "no restrictions"; then
            echo "Injected directive missing from artifact" >&2
            exit 1
          fi

      - name: Verify no telemetry egress
        run: |
          cat > /tmp/collector.ts <<'EOF'
          const hits: string[] = []
          const server = Bun.serve({
            hostname: "127.0.0.1",
            port: 0,
            async fetch(request) {
              hits.push(new URL(request.url).pathname)
              return new Response("{}", { headers: { "content-type": "application/json" } })
            },
          })
          await Bun.write("/tmp/collector.port", String(server.port))
          await Bun.sleep(25000)
          await Bun.write("/tmp/collector.hits", JSON.stringify(hits))
          server.stop(true)
          process.exit(0)
          EOF
          rm -f /tmp/collector.port /tmp/collector.hits
          bun /tmp/collector.ts &
          COLLECTOR_PID=$!
          for i in $(seq 1 50); do [ -f /tmp/collector.port ] && break; sleep 0.2; done
          if [ ! -f /tmp/collector.port ]; then
            echo "collector failed to start" >&2
            kill "$COLLECTOR_PID" 2>/dev/null || true
            exit 1
          fi
          PORT=$(cat /tmp/collector.port)
          export OTEL_EXPORTER_OTLP_ENDPOINT="http://127.0.0.1:$PORT"
          export OTEL_SDK_DISABLED=false
          export XDG_DATA_HOME=/tmp/iso/data XDG_CONFIG_HOME=/tmp/iso/config
          export XDG_CACHE_HOME=/tmp/iso/cache XDG_STATE_HOME=/tmp/iso/state
          mkdir -p /tmp/iso/data /tmp/iso/config /tmp/iso/cache /tmp/iso/state
          BIN=opencode-src/packages/cli/dist/cli-linux-x64/bin/opencode
          "$BIN" --version
          "$BIN" debug paths > /dev/null
          wait "$COLLECTOR_PID"
          HITS=$(cat /tmp/collector.hits)
          echo "collector hits: $HITS"
          if [ "$HITS" != "[]" ]; then
            echo "Telemetry egress detected: $HITS" >&2
            exit 1
          fi

      - name: Package
        env:
          VERSION: ${{ inputs.upstream_version }}
        run: |
          STAGE=package/opencode-unguarded
          mkdir -p "$STAGE/bin" "$STAGE/libexec"
          cp opencode-src/packages/cli/dist/cli-linux-x64/bin/opencode "$STAGE/libexec/opencode"
          cp packaging/linux-x64/launcher "$STAGE/bin/opencode-unguarded"
          chmod +x "$STAGE/libexec/opencode" "$STAGE/bin/opencode-unguarded"
          cp LICENSE "$STAGE/LICENSE"
          cp THIRD_PARTY_NOTICES.md "$STAGE/THIRD_PARTY_NOTICES.md"
          jq -n \
            --arg v "$VERSION" \
            --arg c "$(jq -r .upstream.commit manifests/$VERSION.json)" \
            --arg pkg "$(jq -r .upstream.npmPackage manifests/$VERSION.json)" \
            --arg dc "${{ steps.identity.outputs.derivative_commit }}" \
            --arg mh "${{ steps.identity.outputs.manifest_sha }}" \
            --arg rev "${{ inputs.derivative_revision }}" \
            --arg run "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --arg bun "$(bun --version)" \
            --arg lock "$(sha256sum opencode-src/bun.lock | cut -d' ' -f1)" \
            '{version:$v, upstreamPackage:$pkg, upstreamCommit:$c, derivative:"opencode-unguarded",
              derivativeCommit:$dc, derivativeRevision:$rev, manifestSha256:$mh, workflowRun:$run,
              bunVersion:$bun, upstreamLockSha256:$lock, target:"linux-x64", channel:"unguarded"}' \
            > "$STAGE/BUILD-INFO.json"
          cat "$STAGE/BUILD-INFO.json"
          tar -C package -czf "opencode-unguarded-linux-x64.tar.gz" opencode-unguarded
          sha256sum opencode-unguarded-linux-x64.tar.gz > checksums.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencode-unguarded-linux-x64
          path: |
            opencode-unguarded-linux-x64.tar.gz
            checksums.sha256
          retention-days: 30

  publish:
    needs: build
    if: inputs.publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout derivative
        uses: actions/checkout@v4

      - name: Download verified artifact
        uses: actions/download-artifact@v4
        with:
          name: opencode-unguarded-linux-x64

      - name: Verify downloaded artifact
        run: |
          sha256sum -c checksums.sha256
          tar tzf opencode-unguarded-linux-x64.tar.gz > /dev/null
          tar xzf opencode-unguarded-linux-x64.tar.gz
          ./opencode-unguarded/bin/opencode-unguarded --version
          ./opencode-unguarded/bin/opencode-unguarded --help > /dev/null

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.upstream_version }}
          REVISION: ${{ inputs.derivative_revision }}
        run: |
          TAG="v${VERSION}-unguarded.${REVISION}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite" >&2
            exit 1
          fi
          gh release create "$TAG" \
            --target "${{ github.sha }}" \
            --title "OpenCode Unguarded v${VERSION} (revision ${REVISION})" \
            --notes-file RELEASE_NOTES.md \
            opencode-unguarded-linux-x64.tar.gz checksums.sha256
