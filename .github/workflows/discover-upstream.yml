name: discover-upstream

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  discover:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Resolve current upstream version
        id: upstream
        run: |
          set -euo pipefail
          VERSION=$(curl -fsSL --retry 3 https://registry.npmjs.org/@opencode/cli/latest | jq -r .version)
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Unexpected version from registry: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ -f "manifests/${VERSION}.json" ]; then
            echo "supported=true" >> "$GITHUB_OUTPUT"
          else
            echo "supported=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Report unsupported version
        if: steps.upstream.outputs.supported == 'false'
        run: |
          echo "::notice::Upstream ${{ steps.upstream.outputs.version }} has no reviewed manifest; not building."
          echo "Add manifests/${{ steps.upstream.outputs.version }}.json after auditing the new source."

      - name: Read the derivative revision for this source
        if: steps.upstream.outputs.supported == 'true'
        id: revision
        env:
          VERSION: ${{ steps.upstream.outputs.version }}
        run: |
          set -euo pipefail
          REVISION=$(jq -r '.derivativeRevision // empty' "manifests/${VERSION}.json")
          if ! printf '%s' "$REVISION" | grep -Eq '^[1-9][0-9]*$'; then
            REVISION=1
          fi
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"

      - name: Check for an existing release
        if: steps.upstream.outputs.supported == 'true'
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.upstream.outputs.version }}
          REVISION: ${{ steps.revision.outputs.revision }}
        run: |
          set -euo pipefail
          if gh release view "v${VERSION}-unguarded.${REVISION}" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for an existing successful candidate build
        if: steps.upstream.outputs.supported == 'true' && steps.release.outputs.exists == 'false'
        id: build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.upstream.outputs.version }}
          REVISION: ${{ steps.revision.outputs.revision }}
        run: |
          set -euo pipefail
          # A failed build must be retryable; a successful candidate build for
          # this exact upstream version and revision must not run every day.
          NAME="build ${VERSION}-unguarded.${REVISION}"
          RUNS=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build-release.yml --limit 100 \
            --json status,conclusion,displayTitle \
            | jq --arg name "$NAME" '[.[] | select(.displayTitle == $name and .conclusion == "success")] | length')
          echo "successful=$RUNS" >> "$GITHUB_OUTPUT"

      - name: Trigger build
        if: |
          steps.upstream.outputs.supported == 'true' &&
          steps.release.outputs.exists == 'false' &&
          steps.build.outputs.successful == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.upstream.outputs.version }}
          REVISION: ${{ steps.revision.outputs.revision }}
        run: |
          gh workflow run build-release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF_NAME" \
            -f upstream_version="$VERSION" \
            -f derivative_revision="$REVISION" \
            -f publish=false
